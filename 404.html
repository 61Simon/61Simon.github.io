<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Simon</title>
    <link rel="icon" type="image/jpeg" href="./mak.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(123, 97, 255, 0.15) 0%, #0a0a0a 65%);
            z-index: -1;
        }
        .container {
            text-align: center;
            max-width: 620px;
            animation: fadeUp 0.8s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .code {
            font-family: 'Syne', sans-serif;
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, #7b61ff, #9d8aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glitch 4s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0, 0); }
            92% { transform: translate(-2px, 1px); }
            94% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, -2px); }
            98% { transform: translate(1px, 2px); }
        }
        h1 { font-family: 'Syne', sans-serif; font-size: 32px; margin-bottom: 16px; }
        p { color: #b3b3b3; font-size: 17px; margin-bottom: 40px; line-height: 1.6; }
        .actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .btn-primary {
            background: #7b61ff;
            color: #fff;
            box-shadow: 0 4px 20px rgba(123, 97, 255, 0.3);
        }
        .btn-primary:hover {
            background: #9d8aff;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(123, 97, 255, 0.4);
        }
        .btn-outline {
            background: transparent;
            color: #7b61ff;
            border-color: #7b61ff;
        }
        .btn-outline:hover {
            background: #7b61ff;
            color: #fff;
            transform: translateY(-3px);
        }
        @media (max-width: 576px) {
            .code { font-size: 100px; }
            h1 { font-size: 24px; }
            p { font-size: 15px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>Looks like this page took a wrong turn.<br>Don't worry — it happens to the best of us.</p>
        <div class="actions">
            <a href="./index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
            <a href="./index.html#portfolio" class="btn btn-outline"><i class="fas fa-briefcase"></i> See Portfolio</a>
        </div>
    </div>
</body>
</html>
